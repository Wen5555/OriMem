[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orimem-mcp"
version = "0.1.2"
description = "Local Obsidian-vault memory for coding agents (Claude Code, Codex, DeepSeek Harness) over MCP: hybrid recall, verified write-back, conversation capture and daily summaries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orion" }]
keywords = ["mcp", "obsidian", "memory", "claude-code", "codex", "deepseek", "agent", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "numpy>=1.24",
    "jsonschema>=4",
    "pyyaml>=6",
    "watchdog>=3",
    "requests>=2.28",
    "zstandard>=0.21",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "transformers>=4.40"]
test = ["pytest>=7"]

[project.scripts]
orimem = "orimem.cli:main"

[project.urls]
Homepage = "https://github.com/Wen5555/OriMem"
Documentation = "https://github.com/Wen5555/OriMem#readme"
Issues = "https://github.com/Wen5555/OriMem/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orimem = ["skill/**/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
